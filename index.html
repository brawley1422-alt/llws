<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLWS Office Pool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  // Fallback target, rewritten on every tunnel start. Used only if target.json
  // can't be fetched (offline, GitHub hiccup).
  var TARGET = "https://recorders-cyber-murphy-payment.trycloudflare.com";

  // The tunnel URL changes whenever Cloudflare drops the quick-tunnel hostname.
  // GitHub Pages serves this page with max-age=600, so a device that loaded it
  // while an OLD tunnel was live would keep redirecting to a dead host until its
  // cache expired. Reading the target from a separate no-store JSON file with a
  // cache-busting query means the hostname is ALWAYS fresh, even if this HTML
  // itself is served from cache.
  function go(target) {
    location.replace(target + location.search + location.hash);
  }
  fetch('target.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { go(d && d.url ? d.url : TARGET); })
    .catch(function () { go(TARGET); });
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1410;color:#e8f1eb;font:16px/1.5 system-ui}
  a{color:#7fd8a8}
</style>
</head>
<body>
  <p>Heading to the pool… <a id="m" href="#">tap here if nothing happens</a></p>
  <script>
    fetch('target.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { document.getElementById('m').href = (d && d.url) ? d.url : TARGET; })
      .catch(function () { document.getElementById('m').href = TARGET; });
  </script>
</body>
</html>
